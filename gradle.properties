# ==== Gradle ====
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
org.gradle.parallel=true

# ==== 代理（本机 services.gradle.org / repo1.maven.org 直连不通）====
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|[::1]

# ==== Fabric (Minecraft 1.20.1) ====
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_version=0.92.12+1.20.1

# ==== ModMenu（可选依赖：只在编译期和开发环境用，发布产物不强依赖）====
modmenu_version=7.2.2

# ==== Mod ====
mod_version=0.2.0
maven_group=com.autobridge
archives_base_name=autobridge
