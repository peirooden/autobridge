# ==== Gradle ====
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
org.gradle.parallel=true

# ==== 代理 ====
# 本机 127.0.0.1:7890（Clash Verge）。maven.fabricmc.net / libraries.minecraft.net /
# piston-meta.mojang.com 直连可用；services.gradle.org / repo1.maven.org 直连不通。
# 需要代理时把下面四行取消注释；代理没开时必须保持注释，否则 Gradle 会连死代理而全线失败。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|[::1]

# ==== Fabric (Minecraft 1.21.1) ====
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
fabric_version=0.116.17+1.21.1

# ==== ModMenu（可选依赖：只在编译期和开发环境用，发布产物不强依赖）====
modmenu_version=11.0.4

# ==== Mod ====
mod_version=0.3.0+1.21.1
maven_group=com.autobridge
archives_base_name=autobridge
