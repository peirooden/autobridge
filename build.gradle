plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

def edition = (findProperty("edition") ?: "user").toString().toLowerCase()
def isDevEdition = edition == "dev"

version = project.mod_version + (isDevEdition ? "-dev" : "")
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

}

def editionOutDir = layout.buildDirectory.dir("generated/sources/edition/java")

tasks.register("generateEdition") {
    def outDir = editionOutDir
    def dev = isDevEdition
    inputs.property "dev", dev
    outputs.dir outDir
    doLast {
        def template = '''package com.autobridge;

public final class Edition {

    public static final boolean DEV = __DEV__;

    public static final String TITLE = "__TITLE__";

    private Edition() {
    }
}
'''
        def content = template
                .replace("__DEV__", dev.toString())
                .replace("__TITLE__", dev ? "AutoBridge Dev" : "AutoBridge")

        def pkgDir = new File(outDir.get().asFile, "com/autobridge")
        pkgDir.mkdirs()
        new File(pkgDir, "Edition.java").setText(content, "UTF-8")
    }
}

sourceSets {
    main {
        java.srcDir editionOutDir
    }
}

tasks.named("compileJava") {
    dependsOn "generateEdition"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
